<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0c0b11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Preconnect to TMDB image CDN for faster image loading -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Preconnect to embed sources -->
    <link rel="dns-prefetch" href="https://cinesrc.st" />
    <link rel="preconnect" href="https://cinesrc.st" />
    <title>Tagflix</title>
    <style>
      /* Prevent flash of unstyled content */
      body { background: #0c0b11; margin: 0; }
    </style>
    <!-- Block all popups from iframes (CineSrc ads) — hardened -->
    <script>
      (function() {
        var blockedOpen = function(url) {
          console.warn('[Tagflix] Blocked popup:', url);
          return null;
        };
        // Permanent override — interval guard prevents ad script from restoring it
        try { window.open = blockedOpen; } catch(e) {}
        setInterval(function() {
          if (window.open !== blockedOpen) {
            try { window.open = blockedOpen; } catch(e) {}
          }
        }, 300);
        // Also freeze where possible so `window.open = ...` silently fails
        try {
          Object.defineProperty(window, 'open', {
            value: blockedOpen,
            writable: false,
            configurable: false
          });
        } catch(e) {}
        // Force landscape window size (works in --app mode)
        try { window.resizeTo(1280, 720); } catch(e) {}
        // Block anchor/form _blank vectors
        document.addEventListener('click', function(e) {
          var a = e.target && (e.target.tagName === 'A' ? e.target : e.target.closest && e.target.closest('a'));
          if (a && (a.target === '_blank' || a.getAttribute('target') === '_blank')) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        document.addEventListener('auxclick', function(e) {
          var a = e.target && (e.target.tagName === 'A' ? e.target : e.target.closest && e.target.closest('a'));
          if (a && a.target === '_blank') {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        // Prevent top-navigation hijacks via beforeunload (ads that do location.href)
        window.addEventListener('beforeunload', function(e) {
          // Only block if triggered very early without user intent — no-op to keep player navigations working
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
