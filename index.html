<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Preconnect to TMDB image CDN for faster image loading -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Preconnect to embed sources -->
    <link rel="dns-prefetch" href="https://vidcore.io" />
    <link rel="dns-prefetch" href="https://www.vidking.net" />
    <title>Tagflix</title>
    <style>
      /* Prevent flash of unstyled content */
      body { background: #0c0b11; margin: 0; }
    </style>
    <!-- Block all popups from iframes (VidCore ads) -->
    <script>
      (function() {
        // Override window.open globally — returns dummy object so scripts don't crash
        window.open = function(url, target, features) {
          console.warn('[Tagflix] Blocked popup:', url);
          return {
            focus: function(){},
            blur: function(){},
            close: function(){},
            closed: false,
            location: { href: '' },
            document: { write: function(){}, writeln: function(){} },
            postMessage: function(){},
          };
        };
        // Force landscape window size (works in --app mode)
        try { window.resizeTo(1280, 720); } catch(e) {}
        // Also prevent beforeunload-based popups
        window.addEventListener('beforeunload', function(e) { e.preventDefault(); });
        // Block onclick-based popups via event listener removal
        document.addEventListener('click', function(e) {
          if (e.target && (e.target.tagName === 'A' || e.target.closest('a'))) {
            var a = e.target.tagName === 'A' ? e.target : e.target.closest('a');
            if (a && a.target === '_blank') {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
