<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Preconnect to TMDB image CDN for faster image loading -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Preconnect to embed sources -->
    <link rel="dns-prefetch" href="https://vidcore.io" />
    <link rel="dns-prefetch" href="https://www.vidking.net" />
    <title>Tagflix</title>
    <style>
      /* Prevent flash of unstyled content */
      body { background: #0c0b11; margin: 0; }
    </style>
    <!-- Block all popups from iframes (VidCore ads) -->
    <script>
      window.open = function () {
        return { focus: function(){}, blur: function(){}, close: function(){}, closed: false };
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
